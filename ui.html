<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --tint: rgba(22, 24, 34, 0.42);      /* over the acrylic glass */
    --hair: rgba(255, 255, 255, 0.08);
    --text: rgba(255, 255, 255, 0.94);
    --dim: rgba(235, 238, 245, 0.5);
    --c1: #5ee7ff; --c2: #9b7bff; --c3: #ff6fd8; --c4: #ffb86b;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased;
  }
  #wrap { background: var(--tint); animation: enter .5s var(--ease) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(-6px) scale(.985); } }

  /* ---------- Apple Intelligence edge glow ---------- */
  .glow {
    position: fixed; inset: 0; border-radius: 8px; pointer-events: none; padding: 2.5px;
    background: conic-gradient(from var(--angle), var(--c1), var(--c2), var(--c3), var(--c4), var(--c1));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .5s var(--ease);
    animation: turn 3.5s linear infinite;
  }
  .glow.soft {   /* inner haze that fades toward the center */
    padding: 0;
    -webkit-mask:
      linear-gradient(to right, #000, transparent 22px, transparent calc(100% - 22px), #000),
      linear-gradient(to bottom, #000, transparent 18px, transparent calc(100% - 18px), #000);
    -webkit-mask-composite: source-over; mask-composite: add;
  }
  body.listening .glow.soft, body.busy .glow.soft { opacity: .35; }
  body.listening .glow, body.busy .glow { opacity: 1; }
  body.listening .glow { animation-duration: 2s; }
  @keyframes turn { to { --angle: 360deg; } }

  /* ---------- bar ---------- */
  .bar { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 20px 0 14px; }

  /* ---------- folded: only the orb ---------- */
  .bar > :not(.orb), .card {
    transition: opacity .28s var(--ease) .12s, transform .28s var(--ease) .12s, filter .28s var(--ease) .12s;
  }
  body.folded .bar > :not(.orb) {
    opacity: 0 !important; filter: blur(4px); transform: translateX(-10px); pointer-events: none;
    transition-delay: 0s; transition-duration: .12s;
  }

  /* Siri-like orb: three blurred color blobs swirling inside a dark sphere */
  .orb {
    --level: 0;
    position: relative; flex: none; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%;
    overflow: hidden; cursor: pointer; background: #0a0b12;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 0 calc(10px + var(--level) * 40px) rgba(155, 123, 255, calc(.25 + var(--level)));
    transform: scale(calc(1 + var(--level) * .35));
    transition: transform .12s var(--ease), box-shadow .12s var(--ease);
  }
  .orb:hover { transform: scale(1.06); }
  .orb:active { transform: scale(.94); }
  .orb:focus-visible { outline: 2px solid var(--c1); outline-offset: 3px; }
  .blob {
    position: absolute; inset: -35%; border-radius: 50%; filter: blur(5px); mix-blend-mode: screen;
    animation: swirl 7s linear infinite;
  }
  .blob.a { background: radial-gradient(circle at 30% 30%, var(--c1), transparent 55%); }
  .blob.b { background: radial-gradient(circle at 72% 38%, var(--c2), transparent 55%); animation-duration: 9s; animation-direction: reverse; }
  .blob.c { background: radial-gradient(circle at 48% 78%, var(--c3), transparent 55%); animation-duration: 11s; }
  .orb::after {   /* glassy highlight */
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 25%, rgba(255, 255, 255, .55), transparent 40%);
  }
  body.listening .blob { animation-duration: 1.6s; }
  body.busy .blob { animation-duration: 1.1s; }
  @keyframes swirl { to { transform: rotate(360deg); } }

  input {
    flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0;
    color: var(--text); caret-color: var(--c1);
    font: 400 18px/1 inherit; font-family: inherit; letter-spacing: -.01em;
  }
  input::placeholder { color: var(--dim); transition: opacity .3s; }
  input:focus::placeholder { opacity: .6; }

  .status {
    flex: none; font-size: 13px; font-weight: 500; letter-spacing: -.005em; white-space: nowrap;
    background: linear-gradient(90deg, var(--dim) 20%, #fff 50%, var(--dim) 80%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.8s linear infinite;
    opacity: 0; transform: translateX(6px); transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .status.on { opacity: 1; transform: none; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  .close {
    flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; background: rgba(255, 255, 255, .08); color: var(--dim);
    opacity: 0; transform: scale(.8); transition: opacity .25s var(--ease), transform .25s var(--ease), background .2s;
  }
  .bar:hover .close, .close:focus-visible { opacity: 1; transform: none; }
  .close:hover { background: rgba(255, 255, 255, .16); color: var(--text); }

  /* ---------- reply ---------- */
  .card {
    margin: 0 16px; padding: 14px 6px 18px 50px; border-top: 1px solid var(--hair);
    max-height: 240px; overflow-y: auto; white-space: pre-wrap;
    opacity: 0; transform: translateY(-4px); transition: opacity .35s var(--ease), transform .35s var(--ease);
  }
  .card[hidden] { display: none; }
  .card.show { opacity: 1; transform: none; }
  .card::-webkit-scrollbar { width: 0; }
  .you { display: block; color: var(--dim); font-size: 12.5px; margin-bottom: 6px; }
  .reply { font-size: 15px; line-height: 1.55; letter-spacing: -.005em; }
  .reply .w { opacity: 0; filter: blur(5px); animation: word .45s var(--ease) forwards; }
  @keyframes word { to { opacity: 1; filter: blur(0); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body class="folded">
<div class="glow soft"></div>
<div class="glow"></div>
<div id="wrap">
  <div class="bar pywebview-drag-region">
    <button class="orb" id="orb" title="Talk (Ctrl+Space)" aria-label="Talk to Jarvis">
      <span class="blob a"></span><span class="blob b"></span><span class="blob c"></span>
    </button>
    <input id="q" placeholder="Ask Jarvis" autocomplete="off" spellcheck="false" aria-label="Command">
    <span class="status" id="status" aria-live="polite"></span>
    <button class="close" id="close" title="Quit" aria-label="Quit">
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="card" id="card" hidden aria-live="polite"><span class="you" id="you"></span><div class="reply" id="reply"></div></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const CARD_HIDE_MS = 15000;
  const FOLD_AFTER_MS = 1800;          // idle time before folding back into the orb
  const BAR_WIDTH = 720, ORB_SIZE = 64; // match jarvis.py
  const WORD_STAGGER_MS = 28, MAX_STAGGER_MS = 900;
  let hideTimer, foldTimer, hovering = false, mode = "";

  const api = () => window.pywebview.api;
  const folded = () => document.body.classList.contains("folded");
  const fit = () => folded() ? api().layout(ORB_SIZE, ORB_SIZE) : api().layout(BAR_WIDTH, $("wrap").offsetHeight);

  function unfold() {
    clearTimeout(foldTimer);
    if (!folded()) return;
    document.body.classList.remove("folded");
    fit();
  }

  // Fold only when nothing is going on: not hovered, not busy, empty box, no answer showing.
  function maybeFold() {
    clearTimeout(foldTimer);
    foldTimer = setTimeout(() => {
      if (hovering || mode || $("q").value.trim() || !$("card").hidden) return;
      document.body.classList.add("folded");
      $("q").blur();
      setTimeout(fit, 120);   // let the content fade before the window shrinks
    }, FOLD_AFTER_MS);
  }

  function send(text) {
    text = text.trim();
    if (!text) return;
    $("q").value = "";
    api().send(text);
  }

  function revealWords(el, text) {
    el.textContent = "";
    let i = 0;
    for (const part of text.split(/(\s+)/)) {
      if (!part) continue;
      if (/^\s+$/.test(part)) { el.append(part); continue; }
      const w = document.createElement("span");
      w.className = "w";
      w.textContent = part;
      w.style.animationDelay = Math.min(i++ * WORD_STAGGER_MS, MAX_STAGGER_MS) + "ms";
      el.append(w);
    }
  }

  // Called from Python
  window.jarvis = {
    state(newMode, label) {
      mode = newMode;                    // "", "listening", "busy"
      document.body.classList.remove("listening", "busy");
      if (mode) { document.body.classList.add(mode); unfold(); } else maybeFold();
      const s = $("status");
      if (label) s.textContent = label;
      s.classList.toggle("on", !!label);
      if (mode !== "listening") $("orb").style.setProperty("--level", 0);
    },
    unfold,
    level(v) { $("orb").style.setProperty("--level", Math.min(1, v).toFixed(3)); },
    heard(text) { $("q").value = text; },
    show(you, reply) {
      clearTimeout(hideTimer);
      const card = $("card");
      $("you").textContent = you;
      revealWords($("reply"), reply);
      card.hidden = false;
      fit();
      requestAnimationFrame(() => card.classList.add("show"));
      hideTimer = setTimeout(hideCard, CARD_HIDE_MS);
    },
  };

  function hideCard() {
    const card = $("card");
    if (card.hidden) return;
    card.classList.remove("show");
    setTimeout(() => { card.hidden = true; fit(); maybeFold(); }, 300);
  }

  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send($("q").value);
    if (e.key === "Escape") hideCard();
  });
  $("orb").addEventListener("click", () => { unfold(); api().listen(); });
  $("close").addEventListener("click", () => api().quit());
  document.documentElement.addEventListener("mouseenter", () => { hovering = true; unfold(); $("q").focus(); });
  document.documentElement.addEventListener("mouseleave", () => { hovering = false; maybeFold(); });
  $("q").addEventListener("input", unfold);
</script>
</body>
</html>
