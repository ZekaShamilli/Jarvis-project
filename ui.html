<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0e111a;   /* must match BG in jarvis.py */
    --line: rgba(255, 255, 255, 0.07);
    --text: #eef2f8;
    --dim: #8a93a6;
    --cyan: #5ee7ff;
    --violet: #8b7bff;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }

  .bar {
    display: flex; align-items: center; gap: 14px;
    height: 64px; padding: 0 14px 0 12px;
  }

  /* orb */
  .orb {
    position: relative; flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #fff 0, var(--cyan) 28%, var(--violet) 75%, #3b2a8f 100%);
    box-shadow: 0 0 18px rgba(94, 231, 255, 0.45);
    animation: breathe 3.2s ease-in-out infinite;
  }
  .orb::before, .orb::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid var(--cyan); opacity: 0;
  }
  .orb:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
  body.listening .orb { animation: none; box-shadow: 0 0 28px rgba(94, 231, 255, 0.9); }
  body.listening .orb::before { animation: ring 1.4s ease-out infinite; }
  body.listening .orb::after { animation: ring 1.4s ease-out 0.7s infinite; }
  body.busy .orb { animation: spin 1.1s linear infinite;
    background: conic-gradient(from 0deg, var(--cyan), var(--violet), #1b1f2e, var(--cyan)); }
  @keyframes breathe { 50% { transform: scale(0.92); box-shadow: 0 0 10px rgba(94, 231, 255, 0.3); } }
  @keyframes ring { from { transform: scale(0.9); opacity: 0.8; } to { transform: scale(1.7); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  input {
    flex: 1; min-width: 0; height: 100%; background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 18px; font-family: inherit;
  }
  input::placeholder { color: var(--dim); }
  .status { flex: none; font-size: 12px; color: var(--cyan); letter-spacing: 0.04em; white-space: nowrap; }
  .close {
    flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--dim); font-size: 16px; line-height: 1;
  }
  .close:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }

  /* reply card */
  .card {
    padding: 14px 20px 18px 66px; border-top: 1px solid var(--line);
    color: var(--text); font-size: 15px; line-height: 1.5;
    opacity: 0; transition: opacity .25s;
    max-height: 220px; overflow-y: auto; white-space: pre-wrap;
  }
  .card.show { opacity: 1; }
  .card .you { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .card[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) { .orb, .orb::before, .orb::after { animation: none !important; } }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar pywebview-drag-region">
    <button class="orb" id="orb" title="Talk (Ctrl+Space)" aria-label="Talk to Jarvis"></button>
    <input id="q" placeholder="Ask Jarvis…" autocomplete="off" spellcheck="false" aria-label="Command">
    <span class="status" id="status" aria-live="polite"></span>
    <button class="close" id="close" title="Quit" aria-label="Quit">✕</button>
  </div>
  <div class="card" id="card" hidden aria-live="polite"><span class="you" id="you"></span><span id="reply"></span></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const CARD_HIDE_MS = 15000;
  let hideTimer;

  const api = () => window.pywebview.api;
  const fit = () => api().fit(document.getElementById("wrap").offsetHeight);

  function send(text) {
    text = text.trim();
    if (!text) return;
    $("q").value = "";
    api().send(text);
  }

  // Called from Python
  window.jarvis = {
    state(mode, label) {
      document.body.className = mode;   // "", "listening", "busy"
      $("status").textContent = label || "";
    },
    heard(text) { $("q").value = text; },
    show(you, reply) {
      clearTimeout(hideTimer);
      $("you").textContent = you;
      $("reply").textContent = reply;
      const card = $("card");
      card.hidden = false;
      requestAnimationFrame(() => { card.classList.add("show"); fit(); });
      hideTimer = setTimeout(hideCard, CARD_HIDE_MS);
    },
  };

  function hideCard() {
    const card = $("card");
    card.classList.remove("show");
    setTimeout(() => { card.hidden = true; fit(); }, 250);
  }

  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send($("q").value);
    if (e.key === "Escape") hideCard();
  });
  $("orb").addEventListener("click", () => api().listen());
  $("close").addEventListener("click", () => api().quit());
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.code === "Space") { e.preventDefault(); api().listen(); }
  });
  window.addEventListener("pywebviewready", () => { fit(); $("q").focus(); });
</script>
</body>
</html>
